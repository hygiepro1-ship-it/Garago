# Vérifie chaque envoi sur GitHub : types TypeScript, tests (règles de réservation et sécurité), lint.
# Aucune base de données ni aucun secret : les tests remplacent l'adresse de la base par une adresse
# inexistante (tests/security/setup.mjs). Le lint ne bloque pas encore (174 erreurs anciennes à résorber).
name: Qualité du code

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Générer le client Prisma
        run: npx prisma generate
      - name: Types TypeScript
        run: npm run typecheck
      - name: Tests
        shell: bash
        # Les tests en échec sont aussi publiés en annotations (lisibles sans connexion à GitHub).
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log
          status=$?
          if [ $status -ne 0 ]; then
            { grep -aE "^not ok|✖|AssertionError|Error|expected|actual|Cannot|failed" test.log | head -20; tail -n 25 test.log; } | while IFS= read -r line; do [ -n "$line" ] && echo "::error title=Test en échec::$line"; done
          fi
          exit $status
      - name: Lint (informatif)
        run: npm run lint
        continue-on-error: true
